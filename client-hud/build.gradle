plugins {
    id 'net.fabricmc.fabric-loom' version '1.19.4'
}

version = '1.0.0'
group = 'com.sdcraft'

dependencies {
    minecraft 'com.mojang:minecraft:26.3'
    implementation 'net.fabricmc:fabric-loader:0.20.1'
    implementation 'net.fabricmc.fabric-api:fabric-api:0.167.0+26.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

java {
    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
    withSourcesJar()
}
tasks.withType(JavaCompile).configureEach {
    options.release = 25
    options.encoding = 'UTF-8'
}
tasks.withType(AbstractArchiveTask).configureEach {
    preserveFileTimestamps = false
    reproducibleFileOrder = true
}
test { useJUnitPlatform() }

tasks.register('prepareAssets', Exec) {
    workingDir projectDir
    commandLine 'python3', 'tools/prepare_assets.py'
    inputs.files(fileTree('../creative/source/branding'), fileTree('../creative/generated_128/manifests'))
    outputs.dir(layout.buildDirectory.dir('generated/assets'))
}
sourceSets.main.resources.srcDir(layout.buildDirectory.dir('generated/assets'))
processResources {
    dependsOn prepareAssets
    inputs.property 'version', project.version
    filesMatching('fabric.mod.json') { expand version: project.version }
}
tasks.named('sourcesJar') { dependsOn prepareAssets }
