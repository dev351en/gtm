name: GTM no-client-mod crossplay candidate

on:
  push:
    branches: [fix/server-only-crossplay-20261126, fix/crossplay-models-20261126]
  pull_request:
    branches: [main, fix/server-only-crossplay-20261126]
    paths:
      - 'hotfix/**'
      - 'tools/build_repair_release.py'
      - 'tools/check_crossplay_models.py'
      - 'tools/install_runtime_repair.py'
      - 'tools/package_server_only_crossplay.py'
      - 'docs/SERVER_ONLY_CROSSPLAY_2026-11-26.md'
      - '.github/workflows/crossplay-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtm-crossplay-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-server-only:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned pack builder
        run: python -m pip install -r tools/requirements-gtm128.txt
      - name: Compile, unit test and check server runtime patches
        working-directory: hotfix
        run: gradle --no-daemon clean check jar patchVehicle patchNpcCombat
      - name: Check resource packs and update/rollback integrity
        run: |
          python -m unittest discover -s tools -p test_repaired_packs.py -v
          python -m unittest discover -s tools -p test_rickshaw_canopy.py -v
          python -m unittest discover -s tools -p test_install_runtime_repair.py -v
          python -m unittest discover -s tools -p test_crossplay_asset_checks.py -v
      - name: Build server-only 1.0.7 with original modelled assets
        run: |
          python tools/build_repaired_packs.py
          python tools/build_repair_release.py --server-only --overlay hotfix/build/libs/GTM-Repair-Classes-1.0.5-r4-spec-candidate-overlay.jar --vehicle-class hotfix/build/vehicle-patch/com/sdcraft/core/GtmVehicles.class --output build/crossplay-release
          python tools/check_crossplay_models.py
          python tools/package_server_only_crossplay.py
      - name: Verify no client mods or world data in download
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import zipfile
          p = Path("dist/crossplay/GTM_Server_Only_Crossplay_1.0.7.zip")
          with zipfile.ZipFile(p) as z:
              names = z.namelist()
              assert all("/client/" not in n for n in names)
              assert all("fabric" not in n.lower() and "forge" not in n.lower() for n in names)
              assert all("world/" not in n and "playerdata/" not in n for n in names)
          report = json.loads(Path("dist/crossplay/crossplay-report.json").read_text())
          assert report["requires_client_mod"] is False
          assert report["java_bedrock_smoke_test"] == "PENDING_REAL_CLIENTS"
          print("SERVER-ONLY ARCHIVE PASS; real Bedrock acceptance still outstanding")
          PY
      - name: Upload no-mod server candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GTM-server-only-crossplay-1.0.7-candidate
          path: dist/crossplay/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
