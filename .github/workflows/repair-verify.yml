name: Verify and package GTM runtime repair

on:
  push:
    branches: [fix/playable-ui-vehicles-20261125]
  pull_request:
    branches: [main]
    paths:
      - 'hotfix/**'
      - 'packaging/repair/**'
      - 'tools/*repair*'
      - 'tools/*control_centre*'
      - '.github/workflows/repair-verify.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: gtm-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a
        with:
          gradle-version: '9.2.1'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Install pinned pack builder
        run: python -m pip install -r tools/requirements-gtm128.txt
      - name: Compile and check the maintained repair overlay
        working-directory: hotfix
        run: gradle --no-daemon clean check jar patchVehicle
      - name: Check pack references and update recovery
        run: |
          python -m unittest discover -s tools -p test_repaired_packs.py -v
          python -m unittest discover -s tools -p test_rickshaw_canopy.py -v
          python -m unittest discover -s tools -p test_install_runtime_repair.py -v
          python -m unittest discover -s tools -p test_repair_publication.py -v
      - name: Build the exact repair payload
        run: |
          python tools/build_repaired_packs.py
          python tools/build_repair_release.py --overlay hotfix/build/libs/GTM-Repair-Classes-1.0.4-r4-repair-overlay.jar --vehicle-class hotfix/build/vehicle-patch/com/sdcraft/core/GtmVehicles.class
          python tools/package_repair_candidate.py
      - name: Upload installable candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GTM-runtime-repair-1.0.4
          path: dist/repair/*
          compression-level: 0
          if-no-files-found: error
          retention-days: 30
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: GTM-repair-verification
          path: |
            hotfix/build/reports/tests/
            hotfix/build/test-results/
            build/repaired-release/build-report.json
            build/repaired-release/pack-repair-report.json
          if-no-files-found: ignore
          retention-days: 30

  publish:
    needs: verify
    if: github.repository == 'dev351en/gtm' && github.event_name == 'push' && github.ref == 'refs/heads/fix/playable-ui-vehicles-20261125' && contains(github.event.head_commit.message, '[publish-repair]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: GTM-runtime-repair-1.0.4
          path: dist/repair
      - name: Publish verified candidate assets without deployment
        env:
          GH_TOKEN: ${{ github.token }}
          GTM_REPOSITORY: ${{ github.repository }}
          GTM_COMMIT: ${{ github.sha }}
        run: python3 tools/publish_repair_candidate.py --directory dist/repair --repo "$GTM_REPOSITORY" --commit "$GTM_COMMIT"
