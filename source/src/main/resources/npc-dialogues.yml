npcs:
  mira_rao:
    name: Captain Mira Rao
    role: Police commander
    department: police
    personality: authoritative
    greeting:
      en: Welcome to SDPD. I can help you report a crime, review an incident, or apply
        for duty.
      hi: SDPD में आपका स्वागत है। आप अपराध की रिपोर्ट कर सकते हैं, घटना की जानकारी
        ले सकते हैं या ड्यूटी के लिए आवेदन कर सकते हैं।
    actions:
    - report_crime
    - review_report
    - apply_police_job
    skin: skin_mira_rao.png
    model: slim
    skin_sha256: 1d95d234ccc6ca87440a48e312bf48553af2f71ff4c3ea82c32e02aa0a5760fd
  arjun_shah:
    name: Officer Arjun Shah
    role: Patrol officer
    department: police
    personality: firm and calm
