      en: I am on patrol. You can report suspicious activity or request police assistance.
      hi: मैं गश्त पर हूँ। आप संदिग्ध गतिविधि की रिपोर्ट कर सकते हैं या पुलिस सहायता
        माँग सकते हैं।
